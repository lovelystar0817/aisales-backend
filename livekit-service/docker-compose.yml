services:
  livekit-agent:
    build:
      context: .
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VERSION=${VERSION:-latest}
    # Project-specific container name to avoid conflicts
    container_name: aisales-livekit-agent
    env_file:
      - .env
    environment:
      # Ensure these are passed through even if not in .env
      - ENVIRONMENT=${ENVIRONMENT:-prod} # Default to prod if not set
      - COMMIT_HASH=${COMMIT_HASH:-unknown}
      - BUILD_DATE=${BUILD_DATE:-unknown}
      # Add project identifier
      - PROJECT_NAME=aisales
      # Resource limits for agent processes
      - AGENT_MAX_MEMORY_MB=43000 # ~95% of container limit
      - AGENT_MAX_FDS=65536 # Full file descriptor allocation
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    labels:
      - 'com.livekit.service=agent'
      - 'com.livekit.commit=${COMMIT_HASH}'
      - 'com.hupo.app=aisales'
      - 'com.hupo.project=aisales'
    volumes:
      - ./logs:/app/logs:rw
      # Mount Google credentials from path specified in .env
      - ${GOOGLE_CREDENTIALS_PATH}:/app/google-credentials.json:ro
    networks:
      - livekit-network
    # Add tmpfs for pip cache to handle large PyTorch install
    tmpfs:
      - /tmp:size=4g
    # Resource limits for production - using legacy format for compatibility
    mem_limit: 45g # 70% of 64GB
    mem_reservation: 35g # Guaranteed minimum
    cpus: 5.6 # 70% of 8 CPUs
    # Enhanced ulimits for high concurrency
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
      stack:
        soft: 8388608 # 8MB
        hard: 8388608
    # Log configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    # Health check for better monitoring
    healthcheck:
      test: ['CMD', 'pidof', 'python']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  livekit-network:
    driver: bridge
    # Network will be named: aisales_livekit-network (when using -p aisales)
    # This ensures isolation from other projects

volumes:
  agent-logs:
    driver: local
    # Volume will be named: aisales_agent-logs (when using -p aisales)
