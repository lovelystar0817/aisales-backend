<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sales Training Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="scorm-container">
      <div id="loading-screen">
        <div class="loader">
          <div class="spinner"></div>
          <p>Loading AI Sales Training Platform...</p>
        </div>
      </div>

      <div id="app-container" style="display: none">
        <iframe
          id="training-iframe"
          src=""
          width="100%"
          height="100%"
          frameborder="0"
          allowfullscreen
          allow="microphone; camera; autoplay; encrypted-media; fullscreen; geolocation; display-capture"
        >
        </iframe>
      </div>

      <div id="error-screen" style="display: none">
        <div class="error-message">
          <h2>Unable to Load Training Platform</h2>
          <p>
            There was an error loading the AI Sales Training Platform. Please
            try again or contact your administrator.
          </p>
          <button onclick="window.location.reload()">Retry</button>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="scorm-api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
