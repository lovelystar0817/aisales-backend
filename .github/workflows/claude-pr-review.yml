name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5
          allowed_tools: 'Bash(git diff),Bash(git log),Read,Glob,Grep'
          claude_env: |
            CHANGED_FILES=${{ steps.changed-files.outputs.files }}
            PR_TITLE=${{ github.event.pull_request.title }}
            PR_DESCRIPTION=${{ github.event.pull_request.body }}
            PR_NUMBER=${{ github.event.pull_request.number }}
          prompt_file: .github/claude-pr-review-prompt.md

      - name: Get PR diff
        id: get-diff
        run: |
          # Get the full diff with line numbers
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -U0 > pr_diff.txt

      - name: Post review comment
        if: steps.claude-review.outputs.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const executionFile = '${{ steps.claude-review.outputs.execution_file }}';

            // Read and parse the execution log
            const executionLog = JSON.parse(fs.readFileSync(executionFile, 'utf8'));

            // Extract all content from the execution log
            let inlineComments = [];
            let summaryContent = '';
            let fullContent = '';

            for (const entry of executionLog) {
              // Extract assistant messages and tool results
              if (entry.type === 'assistant' && entry.message && entry.message.content) {
                for (const content of entry.message.content) {
                  if (content.type === 'text') {
                    fullContent += content.text + '\n\n';
                  }
                }
              }
              
              if (entry.type === 'user' && entry.message && entry.message.content) {
                for (const content of entry.message.content) {
                  if (content.type === 'tool_result' && content.content) {
                    fullContent += content.content + '\n\n';
                  }
                }
              }
            }

            // Parse inline comments from JSON
            const jsonMatch = fullContent.match(/```json\n({[\s\S]*?})\n```/);
            if (jsonMatch) {
              try {
                const parsed = JSON.parse(jsonMatch[1]);
                if (parsed.comments && Array.isArray(parsed.comments)) {
                  inlineComments = parsed.comments;
                }
              } catch (e) {
                console.error('Failed to parse inline comments:', e);
              }
            }

            // Extract summary content
            const summaryMatch = fullContent.match(/## 🔴 Critical Issues[\s\S]*## 📋 Summary[\s\S]*?(?=\n\n|$)/);
            if (summaryMatch) {
              summaryContent = summaryMatch[0];
            }

            // Get the diff to find line positions
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Create review comments array
            const reviewComments = [];

            for (const comment of inlineComments) {
              const file = files.find(f => f.filename === comment.path);
              if (file) {
                // Find the position in the diff for this line
                const diffLines = (file.patch || '').split('\n');
                let position = null;
                let currentLine = 0;
                
                for (let i = 0; i < diffLines.length; i++) {
                  const line = diffLines[i];
                  if (line.startsWith('@@')) {
                    const match = line.match(/@@ -\d+(?:,\d+)? \+(\d+)/);
                    if (match) {
                      currentLine = parseInt(match[1]) - 1;
                    }
                  } else if (!line.startsWith('-')) {
                    currentLine++;
                    if (currentLine === comment.line) {
                      position = i + 1;
                      break;
                    }
                  }
                }
                
                if (position) {
                  reviewComments.push({
                    path: comment.path,
                    position: position,
                    body: comment.body
                  });
                }
              }
            }

            // Create the review
            const reviewBody = summaryContent || 'Code review completed. See inline comments for details.';

            try {
              // Create a review with comments
              if (reviewComments.length > 0) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: `## 🤖 Claude Code Review\n\n${reviewBody}`,
                  event: 'COMMENT',
                  comments: reviewComments
                });
              } else {
                // If no inline comments, just post the summary
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: `## 🤖 Claude Code Review\n\n${reviewBody}`,
                  event: 'COMMENT'
                });
              }
            } catch (error) {
              console.error('Failed to create review:', error);
              // Fallback to issue comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Claude Code Review\n\n${reviewBody}\n\n---\n*Note: Failed to post inline comments*`
              });
            }
